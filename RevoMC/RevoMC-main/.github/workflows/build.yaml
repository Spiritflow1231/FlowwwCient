
name: Build FlowwwClient

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build launcher
        run: |
          python -m PyInstaller revomc.spec --clean --distpath builds/

      - name: Show build files
        shell: pwsh
        run: |
          Get-ChildItem builds -Recurse

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FlowwwClient-Windows
          path: builds/
          if-no-files-found: error
