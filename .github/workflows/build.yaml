name: Build FlowwwClient

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RevoMC/RevoMC-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build FlowwwClient
        run: |
          python -m PyInstaller revomc.spec --clean --distpath builds/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FlowwwClient-Windows
          path: RevoMC/RevoMC-main/builds/
          if-no-files-found: error
