name: Build FlowwwClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FlowwwClient for Windows
    runs-on: windows-latest

    defaults:
      run:
        working-directory: RevoMC/RevoMC-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build application
        run: |
          python -m PyInstaller revomc.spec --clean --distpath builds/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowwwClient-Windows
          path: RevoMC/RevoMC-main/builds/
          if-no-files-found: error
          retention-days: 7
