name: Build FlowwwClient for Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RevoMC/RevoMC-main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile application and tests
        run: python -m compileall -q main.py core ui tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows application
        id: build-windows-app
        run: |
          python -m PyInstaller revomc.spec --clean --noconfirm --distpath dist --workpath build/pyinstaller-windows

      - name: Verify Windows executable metadata
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\FlowwwClient.exe -PathType Leaf)) {
            throw "PyInstaller did not create dist/FlowwwClient.exe"
          }
          $executable = (Resolve-Path .\dist\FlowwwClient.exe).Path
          $versionInfo = (Get-Item $executable).VersionInfo
          $expectedMetadata = @{
            ProductName = "FlowwwClient"
            FileDescription = "FlowwwClient Minecraft Launcher"
            OriginalFilename = "FlowwwClient.exe"
            CompanyName = "FlowwwClient"
          }
          foreach ($field in $expectedMetadata.Keys) {
            $actual = $versionInfo.$field
            if ($actual -ne $expectedMetadata[$field]) {
              throw "Expected EXE $field '$($expectedMetadata[$field])', got '$actual'"
            }
          }
          Write-Host "EXE company metadata: $($versionInfo.CompanyName) (metadata only; this is not code signing)"

      - name: Sign Windows executable
        id: sign-windows-executable
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_SERVER_URL: ${{ vars.WINDOWS_TIMESTAMP_SERVER_URL || 'http://timestamp.digicert.com' }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            Write-Warning "UNSIGNED: signing secrets are not configured. FlowwwClient.exe has no verified publisher."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw "Both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD must be configured."
          }

          $timestampServer = $env:WINDOWS_TIMESTAMP_SERVER_URL
          $timestampUri = $null
          if (-not [Uri]::TryCreate($timestampServer, [UriKind]::Absolute, [ref]$timestampUri) -or
              $timestampUri.Scheme -notin @("http", "https")) {
            throw "WINDOWS_TIMESTAMP_SERVER_URL must be an absolute HTTP or HTTPS URL."
          }

          $executable = (Resolve-Path .\dist\FlowwwClient.exe).Path
          $certificatePath = Join-Path $env:RUNNER_TEMP "FlowwwClient-signing-$([Guid]::NewGuid().ToString('N')).pfx"
          try {
            try {
              $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
            } catch {
              throw "WINDOWS_SIGNING_CERTIFICATE_BASE64 is not valid Base64."
            }
            if ($certificateBytes.Length -eq 0) {
              throw "The configured signing certificate is empty."
            }
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)

            $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem -Path $sdkBin -Directory -ErrorAction Stop |
              Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
              Where-Object { Test-Path $_ -PathType Leaf } |
              Select-Object -First 1
            if (-not $signTool) {
              throw "Windows SDK signtool.exe was not found."
            }

            & $signTool sign /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr $timestampServer /td SHA256 /d "FlowwwClient" $executable
            $signExitCode = $LASTEXITCODE
            if ($signExitCode -ne 0) {
              throw "signtool signing failed with exit code $signExitCode."
            }
            "signed=true" >> $env:GITHUB_OUTPUT
            Write-Host "FlowwwClient.exe signing completed; signature verification runs in the next step."
          } finally {
            if (Test-Path $certificatePath -PathType Leaf) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
            }
          }

      - name: Verify Authenticode signature
        if: steps.sign-windows-executable.outputs.signed == 'true'
        shell: pwsh
        run: |
          $executable = (Resolve-Path .\dist\FlowwwClient.exe).Path
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signTool = Get-ChildItem -Path $sdkBin -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $signTool) {
            throw "Windows SDK signtool.exe was not found for signature verification."
          }
          & $signTool verify /pa /v $executable
          $verifyExitCode = $LASTEXITCODE
          if ($verifyExitCode -ne 0) {
            throw "Authenticode signature verification failed with exit code $verifyExitCode."
          }
          Write-Host "Authenticode signature verification passed."

      - name: Smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\FlowwwClient.exe -PathType Leaf)) {
            throw "PyInstaller did not create dist/FlowwwClient.exe"
          }
          $executable = (Resolve-Path .\dist\FlowwwClient.exe).Path
          $diagnostics = Join-Path $env:RUNNER_TEMP "FlowwwClient-smoke.log"
          $env:FLOWWWCLIENT_SMOKE_LOG = $diagnostics
          $process = Start-Process `
            -FilePath $executable `
            -ArgumentList @("--smoke-test") `
            -PassThru
          $completed = $process.WaitForExit(120000)
          if (-not $completed) {
            if (-not $process.HasExited) {
              $process.Kill()
              $process.WaitForExit()
            }
            $exitCode = 124
            Write-Warning "FlowwwClient.exe smoke test exceeded the 120-second timeout and was terminated."
          } else {
            $exitCode = $process.ExitCode
          }
          Remove-Item Env:FLOWWWCLIENT_SMOKE_LOG
          if (Test-Path $diagnostics) {
            Get-Content $diagnostics
          } else {
            Write-Warning "The executable did not write a smoke-test diagnostics file."
          }
          Write-Host "FlowwwClient.exe smoke-test exit code: $exitCode"
          if ($exitCode -ne 0) {
            throw "FlowwwClient.exe smoke test failed with exit code $exitCode"
          }

      - name: Package Windows ZIP
        if: always() && steps.sign-windows-executable.outcome != 'failure'
        id: package-windows-zip
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\FlowwwClient.exe -PathType Leaf)) {
            Write-Warning "No executable was produced; skipping ZIP creation."
            exit 0
          }
          Compress-Archive -Path .\dist\FlowwwClient.exe -DestinationPath .\dist\FlowwwClient-Windows.zip -CompressionLevel Optimal -Force
          if (-not (Test-Path .\dist\FlowwwClient-Windows.zip -PathType Leaf)) {
            throw "The Windows ZIP package was not created"
          }
          python -c "from zipfile import ZipFile; archive = ZipFile('dist/FlowwwClient-Windows.zip'); assert archive.namelist() == ['FlowwwClient.exe']; assert archive.testzip() is None"

      - name: Upload Windows ZIP package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlowwwClient-Windows
          path: RevoMC/RevoMC-main/dist/FlowwwClient-Windows.zip
          if-no-files-found: warn
